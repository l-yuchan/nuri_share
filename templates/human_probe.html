<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>누리과정 5영역 판단 테스트</title>
<style>
  :root {
    --bg: #f4f4f1;
    --card: #ffffff;
    --ink: #1b1b19;
    --muted: #6d6d66;
    --line: #e2e2dc;
    --accent: #2b2b28;
    --l0: #2f6fed;
    --l1: #d94f38;
    --l2: #9a4fd0;
    --l3: #178a5e;
    --l4: #b5850f;
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #131312;
      --card: #1d1d1b;
      --ink: #eeeee9;
      --muted: #a0a099;
      --line: #32322e;
      --accent: #eeeee9;
      --l0: #7aa2ff;
      --l1: #ff8a72;
      --l2: #c98cec;
      --l3: #58d3a4;
      --l4: #e5bb52;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 12px 20px 10px;
  }
  .headrow { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; max-width: 880px; margin: 0 auto; }
  .headrow strong { font-size: 15px; letter-spacing: -0.01em; }
  .headrow span { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .bar { max-width: 880px; margin: 8px auto 0; height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar > div { height: 100%; width: 0%; background: var(--accent); transition: width 180ms ease; }
  main { max-width: 880px; margin: 0 auto; padding: 22px 20px 64px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 22px 24px 20px;
    box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
  }
  .rowline { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  .chip {
    display: inline-block; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    font-variant-numeric: tabular-nums;
  }
  .kbdnote { color: var(--muted); font-size: 12px; }
  kbd {
    display: inline-block; font-family: inherit; font-size: 11px; line-height: 1;
    padding: 3px 5px; border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 5px; color: var(--muted); background: var(--bg);
    margin-right: 6px; min-width: 16px; text-align: center;
  }
  .text { font-size: 1.18rem; line-height: 1.8; margin: 6px 0 20px; word-break: keep-all; }
  .stepnote { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
  .labels { display: grid; gap: 8px; }
  .labels button {
    display: flex; align-items: center; width: 100%;
    font: inherit; font-size: 15px; text-align: left; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-left-width: 4px;
    border-radius: 10px; padding: 11px 14px; cursor: pointer;
    transition: transform 80ms ease, background 120ms ease, border-color 120ms ease;
  }
  .labels button:hover { background: color-mix(in srgb, var(--card) 80%, var(--accent) 6%); }
  .labels button:active { transform: scale(.995); }
  .labels button.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
  .labels button:disabled { opacity: .38; cursor: default; }
  .labels button[data-choice="0"] { border-left-color: var(--l0); }
  .labels button[data-choice="1"] { border-left-color: var(--l1); }
  .labels button[data-choice="2"] { border-left-color: var(--l2); }
  .labels button[data-choice="3"] { border-left-color: var(--l3); }
  .labels button[data-choice="4"] { border-left-color: var(--l4); }
  .ghost {
    font: inherit; font-size: 13px; color: var(--muted); background: transparent;
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px; cursor: pointer;
  }
  .ghost:hover { color: var(--ink); border-color: var(--muted); }
  .ghost kbd { margin-right: 4px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .hint {
    border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px;
    color: var(--muted); font-size: 13px; margin: -6px 0 14px;
  }
  .hidden { display: none !important; }
  .panel { margin-top: 16px; }
  .panel summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .panel .body { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .panel .body b { color: var(--ink); font-weight: 600; }
  .done h2, .reveal h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.02em; }
  .done p, .reveal p { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .cta {
    font: inherit; font-size: 15px; font-weight: 600; color: var(--bg); background: var(--accent);
    border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer;
  }
  .cta:hover { opacity: .9; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 18px 0 8px; }
  .stat { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat b { display: block; font-size: 22px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .stat span { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }
  .review { display: grid; gap: 10px; margin-top: 16px; }
  .ritem { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .rtext { font-size: 14px; line-height: 1.6; word-break: keep-all; }
  .rmeta { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 9px; font-size: 12px; color: var(--muted); }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .pill.ok { color: var(--l3); font-weight: 600; }
  .pill.bad { color: var(--l1); font-weight: 600; }
  .pill.amb { color: var(--l4); font-weight: 600; }
  .rform { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
  .rform label { display: flex; gap: 6px; align-items: center; white-space: nowrap; font-size: 12px; color: var(--muted); }
  .rform input[type="text"] { flex: 1 1 180px; }
  .ok { color: var(--l3); font-weight: 600; }
  .bad { color: var(--l1); font-weight: 600; }
  .amb { color: var(--l4); font-weight: 600; }
  .tiny { font-size: 12px; color: var(--muted); }
  .export { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  input[type="text"] {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; width: 100%;
  }
  .reveal td:first-child { min-width: 0; }
  @media (max-width: 560px) {
    main { padding: 14px 12px 48px; }
    .card { padding: 18px 16px; border-radius: 14px; }
    .text { font-size: 1.06rem; }
    header { padding: 10px 12px 8px; }
    .review { gap: 8px; }
    .ritem { padding: 11px 12px; }
    .rtext { font-size: 13.5px; }
  }
</style>
</head>
<body>
<header>
  <div class="headrow">
    <strong>누리과정 5영역 판단 테스트</strong>
    <span id="progressText" aria-live="polite">0 / 0</span>
  </div>
  <div class="bar"><div id="barFill"></div></div>
</header>
<main id="app"></main>
<script>
"use strict";

const DATA = __ITEMS_JSON__;
const LABELS = ["사회관계", "신체운동·건강", "예술경험", "의사소통", "자연탐구"];
const STORE_KEY = "nuri-probe-1-" + DATA.session;
const app = document.getElementById("app");
const progressText = document.getElementById("progressText");
const barFill = document.getElementById("barFill");

const items = DATA.items;
let S = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.answers && typeof parsed.idx === "number") return parsed;
    }
  } catch (err) {
    console.warn("저장된 진행을 읽지 못했습니다.", err);
  }
  return { idx: 0, answers: {}, started: Date.now(), revealed: false };
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (err) { console.warn(err); }
}

function answerFor(id) {
  if (!S.answers[id]) S.answers[id] = { c1: null, c2: null, amb: false, hint: false, t0: Date.now(), ms: 0, step: 1, suspect: false, note: "" };
  return S.answers[id];
}

function answeredCount() {
  return items.filter((it) => {
    const a = S.answers[it.id];
    return a && (a.amb || a.c1 !== null);
  }).length;
}

function updateProgress() {
  const n = answeredCount();
  progressText.textContent = n + " / " + items.length;
  barFill.style.width = (100 * n / items.length) + "%";
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function labelButton(i, disabled, selected) {
  const b = el("button");
  b.dataset.choice = String(i);
  if (disabled) b.disabled = true;
  if (selected) b.classList.add("sel");
  const k = document.createElement("kbd");
  k.textContent = String(i + 1);
  b.appendChild(k);
  b.appendChild(document.createTextNode(LABELS[i]));
  return b;
}

function render() {
  app.textContent = "";
  updateProgress();
  if (S.revealed) { renderReveal(); return; }
  if (S.idx >= items.length) { renderDone(); return; }
  renderItem();
}

function renderItem() {
  const item = items[S.idx];
  const a = answerFor(item.id);
  if (!a.t0) a.t0 = Date.now();
  const card = el("section", "card");

  const top = el("div", "rowline");
  top.appendChild(el("span", "chip", item.id));
  top.appendChild(el("span", "kbdnote", "h 힌트 · ← 이전 · 6 판단 어려움"));
  card.appendChild(top);

  card.appendChild(el("p", "text", item.t));

  if (a.hint) {
    card.appendChild(el("div", "hint", "맥락: " + (item.c || "없음") + " · 연령: " + (item.a || "없음") + " · 출처: " + (item.s === "kicce" ? "KICCE 척도" : "사례집")));
  }

  const labels = el("div", "labels");
  const step = a.step === 2 ? 2 : 1;
  card.appendChild(el("p", "stepnote", step === 1 ? "가장 적합한 영역을 고르세요." : "1순위: " + LABELS[a.c1] + " — 2순위를 고르거나 Enter로 건너뛰세요."));
  for (let i = 0; i < LABELS.length; i += 1) {
    const disabled = step === 2 && i === a.c1;
    labels.appendChild(labelButton(i, disabled, step === 2 && i === a.c1));
  }
  card.appendChild(labels);

  const row = el("div", "row");
  const ambBtn = el("button", "ghost");
  ambBtn.dataset.act = "ambiguous";
  ambBtn.appendChild(document.createTextNode("판단 어려움 "));
  const k6 = document.createElement("kbd"); k6.textContent = "6"; ambBtn.appendChild(k6);
  row.appendChild(ambBtn);

  if (step === 2) {
    const skip = el("button", "ghost");
    skip.dataset.act = "skip2";
    skip.appendChild(document.createTextNode("2순위 없음 "));
    const ke = document.createElement("kbd"); ke.textContent = "Enter"; skip.appendChild(ke);
    row.appendChild(skip);
  }
  if (S.idx > 0) {
    const prev = el("button", "ghost");
    prev.dataset.act = "prev";
    prev.appendChild(document.createTextNode("이전 "));
    const kb = document.createElement("kbd"); kb.textContent = "←"; prev.appendChild(kb);
    row.appendChild(prev);
  }
  card.appendChild(row);

  if (S.idx === 0) card.appendChild(definitionsPanel());
  app.appendChild(card);
  updateProgress();
}

function definitionsPanel() {
  const d = document.createElement("details");
  d.className = "panel";
  const s = document.createElement("summary");
  s.textContent = "영역 정의와 경계 규칙 보기";
  d.appendChild(s);
  const body = document.createElement("div");
  body.className = "body";
  body.innerHTML = __DEFINITIONS_HTML__;
  d.appendChild(body);
  return d;
}

function advance() {
  const item = items[S.idx];
  const a = answerFor(item.id);
  a.ms = a.ms || (Date.now() - (a.t0 || Date.now()));
  a.step = 1;
  S.idx += 1;
  save();
  render();
}

function choose(i) {
  const item = items[S.idx];
  const a = answerFor(item.id);
  if (a.step !== 2) {
    a.c1 = i;
    a.step = 2;
    a.ms = Date.now() - (a.t0 || Date.now());
    save();
    render();
    return;
  }
  if (i === a.c1) return;
  a.c2 = i;
  advance();
}

function markAmbiguous() {
  const item = items[S.idx];
  const a = answerFor(item.id);
  a.amb = true;
  a.c1 = null;
  a.c2 = null;
  advance();
}

function goPrev() {
  if (S.idx === 0) return;
  S.idx -= 1;
  const a = answerFor(items[S.idx].id);
  a.step = a.c2 !== null ? 1 : (a.c1 !== null ? 2 : 1);
  if (a.amb) { a.amb = false; }
  save();
  render();
}

function toggleHint() {
  const item = items[S.idx];
  const a = answerFor(item.id);
  a.hint = true;
  save();
  render();
}

function renderDone() {
  const wrap = el("section", "card done");
  wrap.appendChild(el("h2", null, "분류를 마쳤습니다"));
  wrap.appendChild(el("p", null, "이제 결과를 확인할 수 있습니다. 정답은 아직 공개되지 않았습니다."));
  const row = el("div", "row");
  const btn = el("button", "cta", "결과 보기 (정답 공개)");
  btn.dataset.act = "reveal";
  row.appendChild(btn);
  wrap.appendChild(row);
  app.appendChild(wrap);
}

function b64utf8(s) {
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function renderReveal() {
  const wrap = el("section", "card reveal");
  wrap.appendChild(el("h2", null, "결과"));
  wrap.appendChild(el("p", null, "정답과 비교해 보세요. 라벨이 잘못됐다고 판단되는 항목은 체크해 주세요."));

  const rows = items.map((it) => {
    const a = S.answers[it.id] || {};
    const gold = b64utf8(it.g);
    const amb = !!a.amb;
    const correct = !amb && a.c1 !== null && LABELS[a.c1] === gold;
    return { it, a, gold, amb, correct };
  });
  const answered = rows.filter((r) => r.amb || r.a.c1 !== null);
  const correct = answered.filter((r) => r.correct).length;
  const top2 = answered.filter((r) => r.correct || (r.a.c2 !== null && LABELS[r.a.c2] === r.gold)).length;
  const ambCount = answered.filter((r) => r.amb).length;
  const times = answered.filter((r) => r.a.ms).map((r) => r.a.ms);
  const avg = times.length ? Math.round(times.reduce((x, y) => x + y, 0) / times.length / 1000) : 0;

  const stats = el("div", "summary");
  const stat = (value, caption) => {
    const d = el("div", "stat");
    d.appendChild(el("b", null, value));
    d.appendChild(el("span", null, caption));
    return d;
  };
  stats.appendChild(stat(correct + " / " + answered.length, "1순위 정답 (정확도 " + (100 * correct / Math.max(1, answered.length)).toFixed(1) + "%)"));
  stats.appendChild(stat(top2 + " / " + answered.length, "2순위 안에 정답 포함"));
  stats.appendChild(stat(String(ambCount), "판단 어려움으로 표시"));
  stats.appendChild(stat(avg + "초", "문항당 평균 시간"));
  wrap.appendChild(stats);

  const stratum = (name) => {
    const set = rows.filter((r) => r.it.k === name);
    const ok = set.filter((r) => r.correct).length;
    const doneN = set.filter((r) => r.amb || r.a.c1 !== null).length;
    return { name, ok, doneN };
  };
  const hard = stratum("hard");
  const control = stratum("control");
  const note = el("p", "tiny");
  note.textContent = "어려운 항목(모델 오답·저신뢰) " + hard.ok + "/" + hard.doneN + " · 대조 항목(모델 고신뢰 정답) " + control.ok + "/" + control.doneN;
  wrap.appendChild(note);

  const review = el("div", "review");
  rows.forEach(({ it, a, gold, amb, correct }) => {
    const box = el("div", "ritem");
    box.appendChild(el("div", "rtext", it.t));

    const meta = el("div", "rmeta");
    if (amb) {
      meta.appendChild(el("span", "pill amb", "판단 어려움"));
      meta.appendChild(el("span", null, "정답 " + gold));
    } else if (a.c1 === null || a.c1 === undefined) {
      meta.appendChild(el("span", "pill", "미응답"));
      meta.appendChild(el("span", null, "정답 " + gold));
    } else if (correct) {
      meta.appendChild(el("span", "pill ok", "✓ " + LABELS[a.c1] + " = 정답"));
    } else {
      meta.appendChild(el("span", "pill bad", "✗ " + LABELS[a.c1] + " → 정답 " + gold));
    }
    meta.appendChild(el("span", null, "2순위 " + (a.c2 === null || a.c2 === undefined ? "없음" : LABELS[a.c2])));
    meta.appendChild(el("span", null, a.ms ? (a.ms / 1000).toFixed(1) + "초" : "-"));
    meta.appendChild(el("span", null, it.id + (a.hint ? " · 힌트 사용" : "")));
    box.appendChild(meta);

    const form = el("div", "rform");
    const label = el("label");
    const cb = document.createElement("input");
    cb.type = "checkbox";
    cb.checked = !!a.suspect;
    cb.dataset.suspect = it.id;
    label.appendChild(cb);
    label.appendChild(document.createTextNode("라벨 오류 의심"));
    form.appendChild(label);
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "메모 (선택): 왜 이 라벨이 애매한지";
    input.value = a.note || "";
    input.dataset.note = it.id;
    form.appendChild(input);
    box.appendChild(form);

    review.appendChild(box);
  });
  wrap.appendChild(review);

  const exp = el("div", "export");
  const csvBtn = el("button", "cta", "CSV 내려받기");
  csvBtn.dataset.act = "export-csv";
  const jsonBtn = el("button", "ghost", "JSON 내려받기");
  jsonBtn.dataset.act = "export-json";
  const resetBtn = el("button", "ghost", "진행 초기화");
  resetBtn.dataset.act = "reset";
  exp.appendChild(csvBtn);
  exp.appendChild(jsonBtn);
  exp.appendChild(resetBtn);
  wrap.appendChild(exp);
  app.appendChild(wrap);
}

function download(name, text, type) {
  const blob = new Blob([text], { type: type + ";charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = name;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportRows() {
  return items.map((it) => {
    const a = S.answers[it.id] || {};
    const gold = b64utf8(it.g);
    const amb = !!a.amb;
    const c1 = a.c1 === null || a.c1 === undefined ? "" : LABELS[a.c1];
    return {
      id: it.id,
      source: it.s,
      group_id: it.gid,
      stratum: it.k,
      choice1: c1,
      choice2: a.c2 === null || a.c2 === undefined ? "" : LABELS[a.c2],
      ambiguous: amb ? "yes" : "no",
      hint_used: a.hint ? "yes" : "no",
      elapsed_ms: a.ms ? Math.round(a.ms) : "",
      gold: gold,
      correct: amb ? "no" : (c1 === gold ? "yes" : "no"),
      suspect_label: a.suspect ? "yes" : "no",
      note: (a.note || "").replace(/[\r\n]+/g, " "),
    };
  });
}

function exportCsv() {
  const rows = exportRows();
  const cols = Object.keys(rows[0]);
  const esc = (v) => {
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const text = "\ufeff" + [cols.join(",")].concat(rows.map((r) => cols.map((c) => esc(r[c])).join(","))).join("\r\n") + "\r\n";
  download("human_probe_results.csv", text, "text/csv");
}

app.addEventListener("click", (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  if (btn.dataset.choice !== undefined) { choose(Number(btn.dataset.choice)); return; }
  const act = btn.dataset.act;
  if (act === "ambiguous") markAmbiguous();
  else if (act === "skip2") advance();
  else if (act === "prev") goPrev();
  else if (act === "reveal") { S.revealed = true; save(); render(); }
  else if (act === "export-csv") exportCsv();
  else if (act === "export-json") {
    download("human_probe_results.json", JSON.stringify({ session: DATA.session, exported_at: new Date().toISOString(), rows: exportRows() }, null, 2), "application/json");
  } else if (act === "reset") {
    if (confirm("진행 상황과 응답을 모두 지우고 처음부터 시작할까요? 내려받지 않은 결과는 사라집니다.")) {
      localStorage.removeItem(STORE_KEY);
      S = { idx: 0, answers: {}, started: Date.now(), revealed: false };
      save();
      render();
    }
  }
});

app.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.suspect) {
    const a = answerFor(t.dataset.suspect);
    a.suspect = t.checked;
    save();
  }
});

app.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.dataset && t.dataset.note) {
    const a = answerFor(t.dataset.note);
    a.note = t.value;
    save();
  }
});

document.addEventListener("keydown", (ev) => {
  if (S.revealed) return;
  const tag = ev.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (S.idx >= items.length) {
    if (ev.key === "Enter") { S.revealed = true; save(); render(); }
    return;
  }
  if (ev.key >= "1" && ev.key <= "5") { choose(Number(ev.key) - 1); ev.preventDefault(); return; }
  if (ev.key === "6") { markAmbiguous(); ev.preventDefault(); return; }
  if (ev.key === "h" || ev.key === "H") { toggleHint(); ev.preventDefault(); return; }
  if (ev.key === "Backspace" || ev.key === "ArrowLeft") { goPrev(); ev.preventDefault(); return; }
  if (ev.key === "Enter") {
    const item = items[S.idx];
    const a = answerFor(item.id);
    if (a.step === 2) { advance(); ev.preventDefault(); }
  }
  if (ev.key === "Escape") { ev.preventDefault(); }
});

render();
</script>
</body>
</html>
